<script>
// ============================================================
//  Fraction 类
// ============================================================
class Fraction {
    constructor(num, den) {
        if (den === 0) throw new Error('分母不能为0');
        if (den < 0) { num = -num; den = -den; }
        const g = Fraction._gcd(Math.abs(num), Math.abs(den));
        this.num = num / g;
        this.den = den / g;
    }
    static _gcd(a, b) { while (b) { const t = a % b; a = b; b = t; } return a; }
    add(other) { return new Fraction(this.num * other.den + other.num * this.den, this.den * other.den); }
    sub(other) { return new Fraction(this.num * other.den - other.num * this.den, this.den * other.den); }
    mul(other) { return new Fraction(this.num * other.num, this.den * other.den); }
    div(other) {
        if (other.num === 0) throw new Error('除以0');
        return new Fraction(this.num * other.den, this.den * other.num);
    }
    neg() { return new Fraction(-this.num, this.den); }
    equals(other) { return this.num === other.num && this.den === other.den; }
    toString() {
        if (this.den === 1) return String(this.num);
        return this.num + '/' + this.den;
    }
    static parse(s) {
        s = s.trim();
        if (!s) return null;
        let sign = 1;
        if (s.startsWith('-')) { sign = -1; s = s.slice(1); }
        if (s.startsWith('+')) s = s.slice(1);
        if (s.includes('/')) {
            const parts = s.split('/');
            if (parts.length === 2) {
                const num = parseInt(parts[0], 10);
                const den = parseInt(parts[1], 10);
                if (!isNaN(num) && !isNaN(den) && den !== 0) {
                    return new Fraction(sign * num, den);
                }
            }
            return null;
        }
        const num = parseInt(s, 10);
        if (!isNaN(num)) return new Fraction(sign * num, 1);
        return null;
    }
}

// ============================================================
//  词法分析 & 表达式计算
// ============================================================
const TokenType = {
    NUMBER:'NUMBER', FRACTION:'FRACTION',
    PLUS:'PLUS', MINUS:'MINUS', MUL:'MUL', DIV:'DIV',
    UNARY_MINUS:'UNARY_MINUS',
    LPAREN:'LPAREN', RPAREN:'RPAREN', EOF:'EOF'
};
class Token { constructor(type,value) { this.type=type; this.value=value; } }

function tokenize(input) {
    const tokens = []; let i=0, len=input.length;
    function readNumber() {
        let s = i;
        while (i<len && /[0-9]/.test(input[i])) i++;
        return input.slice(s,i);
    }
    function isDigit(ch) { return /[0-9]/.test(ch); }
    function isUnaryContext() {
        if (tokens.length===0) return true;
        const last = tokens[tokens.length-1];
        return last.type===TokenType.LPAREN || last.type===TokenType.PLUS ||
               last.type===TokenType.MINUS || last.type===TokenType.UNARY_MINUS ||
               last.type===TokenType.MUL || last.type===TokenType.DIV;
    }
    while (i<len) {
        const ch = input[i];
        if (ch === ' ') { i++; continue; }
        if (isDigit(ch)) {
            const numStr = readNumber();
            if (i<len && input[i]==='/') {
                i++;
                if (i<len && isDigit(input[i])) {
                    const denStr = readNumber();
                    tokens.push(new Token(TokenType.FRACTION, numStr + '/' + denStr));
                } else {
                    tokens.push(new Token(TokenType.NUMBER, numStr));
                }
            } else {
                tokens.push(new Token(TokenType.NUMBER, numStr));
            }
            continue;
        }
        switch (ch) {
            case '+': tokens.push(new Token(TokenType.PLUS,'+')); i++; break;
            case '−': case '-':
                if (isUnaryContext()) tokens.push(new Token(TokenType.UNARY_MINUS,'-'));
                else tokens.push(new Token(TokenType.MINUS,'-'));
                i++; break;
            case '×': tokens.push(new Token(TokenType.MUL,'×')); i++; break;
            case '÷': tokens.push(new Token(TokenType.DIV,'÷')); i++; break;
            case '(': tokens.push(new Token(TokenType.LPAREN,'(')); i++; break;
            case ')': tokens.push(new Token(TokenType.RPAREN,')')); i++; break;
            default: i++;
        }
    }
    tokens.push(new Token(TokenType.EOF,null));
    return tokens;
}

function evaluateExpression(input) {
    const eqIdx = input.indexOf('=');
    const expr = eqIdx>=0 ? input.slice(0,eqIdx).trim() : input.trim();
    if (!expr) return null;
    const tokens = tokenize(expr);
    const operandStack = [], operatorStack = [];
    function applyOperator() {
        if (!operatorStack.length) return;
        const op = operatorStack.pop();
        if (op.type === TokenType.UNARY_MINUS) {
            if (!operandStack.length) throw new Error('一元负号缺少操作数');
            const val = operandStack.pop();
            operandStack.push(val.neg());
            return;
        }
        if (operandStack.length < 2) throw new Error('操作数不足');
        const b = operandStack.pop();
        const a = operandStack.pop();
        let result;
        if (op.type === TokenType.PLUS) result = a.add(b);
        else if (op.type === TokenType.MINUS) result = a.sub(b);
        else if (op.type === TokenType.MUL) result = a.mul(b);
        else if (op.type === TokenType.DIV) result = a.div(b);
        else throw new Error('未知运算符');
        operandStack.push(result);
    }
    function precedence(type) {
        if (type===TokenType.PLUS || type===TokenType.MINUS) return 1;
        if (type===TokenType.MUL || type===TokenType.DIV) return 2;
        if (type===TokenType.UNARY_MINUS) return 3;
        return 0;
    }
    let idx = 0;
    while (idx < tokens.length) {
        const token = tokens[idx];
        const type = token.type;
        if (type===TokenType.NUMBER || type===TokenType.FRACTION) {
            let frac = Fraction.parse(token.value);
            if (!frac) throw new Error('无法解析数字: ' + token.value);
            operandStack.push(frac);
            idx++;
        } else if (type===TokenType.PLUS || type===TokenType.MINUS || type===TokenType.MUL || type===TokenType.DIV) {
            while (operatorStack.length && operatorStack[operatorStack.length-1].type!==TokenType.LPAREN &&
                   precedence(operatorStack[operatorStack.length-1].type) >= precedence(type)) {
                applyOperator();
            }
            operatorStack.push(token);
            idx++;
        } else if (type===TokenType.UNARY_MINUS) {
            operatorStack.push(token);
            idx++;
        } else if (type===TokenType.LPAREN) {
            operatorStack.push(token);
            idx++;
        } else if (type===TokenType.RPAREN) {
            while (operatorStack.length && operatorStack[operatorStack.length-1].type!==TokenType.LPAREN) applyOperator();
            if (!operatorStack.length) throw new Error('括号不匹配');
            operatorStack.pop();
            idx++;
        } else if (type===TokenType.EOF) break;
        else idx++;
    }
    while (operatorStack.length) {
        const op = operatorStack[operatorStack.length-1];
        if (op.type===TokenType.LPAREN) throw new Error('括号不匹配');
        applyOperator();
    }
    if (!operandStack.length) return null;
    if (operandStack.length>1) throw new Error('表达式不完整');
    return operandStack[0];
}

// ============================================================
//  随机工具 & 题目生成
// ============================================================
function randInt(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }

function generateNumber(domain, digits) {
    const maxVal = Math.pow(10, digits) - 1;
    if (domain === 'nonneg') {
        return new Fraction(randInt(0, maxVal), 1);
    } else if (domain === 'integer') {
        return new Fraction(randInt(-maxVal, maxVal), 1);
    } else { // rational
        if (Math.random() < 0.5) {
            return new Fraction(randInt(-maxVal, maxVal), 1);
        } else {
            let num = randInt(-maxVal, maxVal);
            let den = randInt(2, 8);
            let attempts = 0;
            while (num === 0 && attempts < 20) {
                num = randInt(-maxVal, maxVal);
                attempts++;
            }
            if (num === 0) num = randInt(1, maxVal) * (Math.random()<0.5?1:-1);
            return new Fraction(num, den);
        }
    }
}

function generateProblem(n, opType, domain, digits) {
    let numbers = [];
    for (let i=0; i<n; i++) {
        numbers.push(generateNumber(domain, digits));
    }

    let opPool;
    if (opType === 'addsub') opPool = ['+', '-'];
    else if (opType === 'muldiv') opPool = ['×', '÷'];
    else opPool = ['+', '-', '×', '÷'];

    let ops = [];
    for (let i=0; i<n-1; i++) {
        ops.push(opPool[randInt(0, opPool.length-1)]);
    }

    for (let i=0; i<ops.length; i++) {
        if (ops[i] === '÷') {
            let j = i+1;
            if (numbers[j].num === 0) {
                let attempts = 0;
                let newNum;
                do {
                    newNum = generateNumber(domain, digits);
                    attempts++;
                } while (newNum.num === 0 && attempts < 50);
                numbers[j] = newNum;
            }
        }
    }

    let exprParts = [];
    for (let i=0; i<numbers.length; i++) {
        let numStr = numbers[i].toString();
        if (i>0 && numbers[i].num < 0) {
            numStr = '(' + numStr + ')';
        }
        exprParts.push(numStr);
        if (i < ops.length) {
            exprParts.push(' ' + ops[i] + ' ');
        }
    }
    let displayExpr = exprParts.join('') + ' = ?';
    let answer;
    try {
        answer = evaluateExpression(exprParts.join(''));
    } catch(e) {
        return generateProblem(n, opType, domain, digits);
    }
    if (answer === null) {
        return generateProblem(n, opType, domain, digits);
    }
    return {
        numbers, ops, answer, display: displayExpr, rawExpr: exprParts.join('')
    };
}

// ============================================================
//  历史记录管理 (localStorage)
// ============================================================
const STORAGE_KEY = 'mathHistory';

function loadHistory() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    } catch { return []; }
}

function saveHistory(history) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

function addHistoryRecord(problemDisplay, userExpression, correctAnswer, resultText) {
    const history = loadHistory();
    const record = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        problemDisplay: problemDisplay,
        userExpression: userExpression,
        correctAnswer: correctAnswer,
        result: resultText, // "正确" 或 "错误"
        timestamp: new Date().toLocaleString()
    };
    history.unshift(record);
    if (history.length > 200) history.pop(); // 限制最多200条
    saveHistory(history);
    return record;
}

function deleteHistoryRecord(id) {
    let history = loadHistory();
    history = history.filter(item => item.id !== id);
    saveHistory(history);
}

function clearAllHistory() {
    saveHistory([]);
}

// ============================================================
//  UI 控制
// ============================================================
const problemDisplay = document.getElementById('problemDisplay');
const expressionDisplay = document.getElementById('expressionDisplay');
const placeholder = document.getElementById('placeholder');
const resultB = document.getElementById('resultB');
const judgeBadge = document.getElementById('judgeBadge');
const newProblemBtn = document.getElementById('newProblemBtn');
const nButtons = document.querySelectorAll('.n-btn');
const optButtons = document.querySelectorAll('.opt-btn[data-opt]');
const domainButtons = document.querySelectorAll('.opt-btn[data-domain]');
const digitsButtons = document.querySelectorAll('.opt-btn[data-digits]');
const totalAttemptsSpan = document.getElementById('totalAttempts');
const correctAttemptsSpan = document.getElementById('correctAttempts');
const accuracyRateSpan = document.getElementById('accuracyRate');
const clearStatsBtn = document.getElementById('clearStatsBtn');
const historyBtn = document.getElementById('historyBtn');
const historyModal = document.getElementById('historyModal');
const historyBody = document.getElementById('historyBody');
const modalCloseBtn = document.getElementById('modalCloseBtn');
const modalCloseBtn2 = document.getElementById('modalCloseBtn2');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');

let currentN = 2;
let currentOpType = 'addsub';
let currentDomain = 'nonneg';
let currentDigits = 1;
let currentProblem = null;
let expression = '';
let totalAttempts = 0;
let correctAttempts = 0;

// 统计
function updateStats() {
    totalAttemptsSpan.textContent = totalAttempts;
    correctAttemptsSpan.textContent = correctAttempts;
    accuracyRateSpan.textContent = totalAttempts===0 ? '0%' : (correctAttempts/totalAttempts*100).toFixed(1)+'%';
}

function clearStats() {
    if (!confirm('确定清除所有做题记录吗？')) return;
    totalAttempts = 0;
    correctAttempts = 0;
    updateStats();
    expression = '';
    updateInputDisplay();
    clearJudgeResult();
    alert('统计已重置！');
}

function setActive(buttons, attr, value) {
    buttons.forEach(btn => {
        const val = btn.dataset[attr];
        btn.classList.toggle('active', String(val) === String(value));
    });
}

function updateInputDisplay() {
    if (expression==='') {
        placeholder.style.display = 'inline';
        expressionDisplay.style.display = 'none';
    } else {
        placeholder.style.display = 'none';
        expressionDisplay.style.display = 'inline';
        expressionDisplay.textContent = expression;
    }
}

function clearJudgeResult() {
    resultB.textContent = '—';
    resultB.className = 'value unknown';
    judgeBadge.textContent = '等待计算';
    judgeBadge.className = 'badge unknown';
}

function appendChar(ch) {
    if (ch==='=') { calculateAndJudge(); return; }
    if (ch==='back') { expression = expression.slice(0,-1); updateInputDisplay(); clearJudgeResult(); return; }
    if (ch==='clear') { expression = ''; updateInputDisplay(); clearJudgeResult(); return; }
    expression += ch;
    updateInputDisplay();
    clearJudgeResult();
}

function calculateAndJudge() {
    if (!currentProblem) { alert('请先生成题目！'); return; }
    if (!expression.trim()) { alert('请先输入计算式！'); return; }
    try {
        const result = evaluateExpression(expression);
        if (result===null) { alert('无法计算该表达式，请检查格式。'); return; }
        totalAttempts++;
        const isCorrect = result.equals(currentProblem.answer);
        if (isCorrect) correctAttempts++;
        updateStats();

        const resultText = isCorrect ? '正确' : '错误';
        // 保存历史
        addHistoryRecord(currentProblem.display, expression, currentProblem.answer.toString(), resultText);

        resultB.textContent = result.toString();
        resultB.className = 'value ' + (isCorrect ? 'correct' : 'wrong');
        judgeBadge.textContent = isCorrect ? '✅ 正确！' : '❌ 错误';
        judgeBadge.className = 'badge ' + (isCorrect ? 'correct' : 'wrong');
    } catch(err) {
        alert('计算错误: ' + err.message);
        console.error(err);
    }
}

function newProblem() {
    currentProblem = generateProblem(currentN, currentOpType, currentDomain, currentDigits);
    problemDisplay.textContent = currentProblem.display;
    expression = '';
    updateInputDisplay();
    clearJudgeResult();
    console.log('✅ 答案 =', currentProblem.answer.toString());
}

// 历史记录模态框
function renderHistory() {
    const history = loadHistory();
    if (history.length === 0) {
        historyBody.innerHTML = '<div class="history-empty">暂无历史记录</div>';
        return;
    }
    let html = '<ul class="history-list">';
    history.forEach(item => {
        const resultClass = item.result === '正确' ? 'correct' : 'wrong';
        html += `
            <li class="history-item">
                <span class="h-problem">${escapeHtml(item.problemDisplay)}</span>
                <span class="h-expr">${escapeHtml(item.userExpression)}</span>
                <span class="h-answer">= ${escapeHtml(item.correctAnswer)}</span>
                <span class="h-result ${resultClass}">${escapeHtml(item.result)}</span>
                <span class="h-time">${escapeHtml(item.timestamp)}</span>
                <button class="h-delete" data-id="${escapeHtml(item.id)}" title="删除该记录">✕</button>
            </li>
        `;
    });
    html += '</ul>';
    historyBody.innerHTML = html;
    // 绑定删除事件
    historyBody.querySelectorAll('.h-delete').forEach(btn => {
        btn.addEventListener('click', function() {
            const id = this.dataset.id;
            if (confirm('确定删除该条记录吗？')) {
                deleteHistoryRecord(id);
                renderHistory();
            }
        });
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function openHistory() {
    renderHistory();
    historyModal.classList.add('active');
}

function closeHistory() {
    historyModal.classList.remove('active');
}

// 键盘与事件绑定
function setupKeyboard() {
    document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('click', function() {
            const val = this.dataset.value;
            if (val) appendChar(val);
        });
    });
    document.addEventListener('keydown', function(e) {
        const key = e.key;
        if (key>='0' && key<='9') { e.preventDefault(); appendChar(key); return; }
        if (key==='+') { e.preventDefault(); appendChar('+'); return; }
        if (key==='-') { e.preventDefault(); appendChar('-'); return; }
        if (key==='*') { e.preventDefault(); appendChar('×'); return; }
        if (key==='/') { e.preventDefault(); appendChar('/'); return; }
        if (key==='(') { e.preventDefault(); appendChar('('); return; }
        if (key===')') { e.preventDefault(); appendChar(')'); return; }
        if (key==='=') { e.preventDefault(); appendChar('='); return; }
        if (key==='Enter') { e.preventDefault(); appendChar('='); return; }
        if (key==='Backspace') { e.preventDefault(); appendChar('back'); return; }
        if (key==='Delete' || key==='Escape') { e.preventDefault(); appendChar('clear'); return; }
    });
    newProblemBtn.addEventListener('click', newProblem);

    nButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const n = parseInt(this.dataset.n,10);
            if (n===currentN) return;
            currentN = n;
            setActive(nButtons, 'n', currentN);
            newProblem();
        });
    });

    optButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const opt = this.dataset.opt;
            if (opt===currentOpType) return;
            currentOpType = opt;
            setActive(optButtons, 'opt', currentOpType);
            newProblem();
        });
    });

    domainButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const dom = this.dataset.domain;
            if (dom===currentDomain) return;
            currentDomain = dom;
            setActive(domainButtons, 'domain', currentDomain);
            newProblem();
        });
    });

    digitsButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const digits = parseInt(this.dataset.digits, 10);
            if (digits===currentDigits) return;
            currentDigits = digits;
            setActive(digitsButtons, 'digits', currentDigits);
            newProblem();
        });
    });

    clearStatsBtn.addEventListener('click', clearStats);

    // 历史记录
    historyBtn.addEventListener('click', openHistory);
    modalCloseBtn.addEventListener('click', closeHistory);
    modalCloseBtn2.addEventListener('click', closeHistory);
    historyModal.addEventListener('click', function(e) {
        if (e.target === this) closeHistory();
    });
    clearHistoryBtn.addEventListener('click', function() {
        if (confirm('确定清空所有历史记录吗？')) {
            clearAllHistory();
            renderHistory();
            alert('历史记录已清空！');
        }
    });
}

function init() {
    setupKeyboard();
    setActive(nButtons, 'n', currentN);
    setActive(optButtons, 'opt', currentOpType);
    setActive(domainButtons, 'domain', currentDomain);
    setActive(digitsButtons, 'digits', currentDigits);
    newProblem();
    updateStats();
    // 加载时清理历史记录中的无效数据（可选）
}

document.addEventListener('DOMContentLoaded', init);
console.log('🧮 有理数四则运算练习已加载（含历史记录）');
</script>
</body>
